appId: au.ingo.inroad
productName: Inroad
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!{design,scripts,sponsor-mail,.github}/**'
  - '!electron.vite.config.*'
  - '!{.prettierrc,components.json,tsconfig*.json,README.md}'
# Used for Windows, Linux and the legacy macOS .icns; macOS 26+ uses the Liquid Glass icon below.
icon: build/icon.png
# The Agent SDK spawns a native Claude binary, which can't run from inside the asar archive.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk*/**
mac:
  category: public.app-category.productivity
  # Icon Composer file (compiled with Xcode 26's actool).
  icon: build/icon.icon
  # No Developer ID: sign ad hoc so it runs on Apple Silicon. Not notarized.
  identity: '-'
  # Hardened runtime is only needed for notarization, and breaks ad hoc builds.
  hardenedRuntime: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  target:
    - dmg
    - zip
win:
  target: nsis
nsis:
  artifactName: ${productName}-${version}-windows-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Office
  maintainer: Ingo Wolf
  target:
    - AppImage
    - deb
appImage:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
publish:
  provider: github
  releaseType: release

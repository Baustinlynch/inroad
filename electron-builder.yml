appId: au.ingo.inroad
productName: Inroad
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.prettierrc,components.json,tsconfig*.json}'
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
dmg:
  artifactName: ${name}-${version}.${ext}
# The Agent SDK spawns a native Claude binary, which can't run from inside the asar archive.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk*/**
